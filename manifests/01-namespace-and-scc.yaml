apiVersion: v1
kind: Namespace
metadata:
  name: pavelagi-omega-prod
  labels:
    app.kubernetes.io/name: pavelagi-omega
    app.kubernetes.io/part-of: cognitive-os
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: pavelagi-omega-prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-cognitive-mesh
  namespace: pavelagi-omega-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: cognitive-os
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: cognitive-os
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 7687
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: cognitive-os
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8
              - 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 443
